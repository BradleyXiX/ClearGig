services:
  db:
    image: postgres:15-alpine
    container_name: cleargig_db_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secretpassword}
      POSTGRES_DB: ${POSTGRES_DB:-cleargig}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    networks:
      - cleargig-network

  backend:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/cleargig-backend:latest
    container_name: cleargig_backend_prod
    restart: always
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-secretpassword}@db:5432/${POSTGRES_DB:-cleargig}?schema=public
      PORT: 5000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      - db
    networks:
      - cleargig-network

  frontend:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/cleargig-frontend:latest
    container_name: cleargig_frontend_prod
    restart: always
    ports:
      - "80:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api/v1}
    depends_on:
      - backend
    networks:
      - cleargig-network

volumes:
  pgdata_prod:

networks:
  cleargig-network:
